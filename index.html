<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daddy Amma | Digital Menu</title>
    <!-- Tailwind CSS 4 Play CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style type="text/css">
        @theme {
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .modal-active {
            overflow: hidden !important;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-amber-100">

    <!-- Header -->
    <header class="bg-white pt-10 pb-6 px-6 shadow-sm border-b border-slate-100">
        <div class="flex justify-between items-start mb-6">
            <div>
                <span class="inline-block bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-[10px] font-bold tracking-widest uppercase mb-2">
                    Guest Digital Menu
                </span>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">
                    DADDY <span class="text-amber-500 underline decoration-4 underline-offset-4">AMMA</span>
                </h1>
                <p class="text-slate-500 text-sm mt-1">Authentic flavours, freshly prepared.</p>
            </div>
            <div class="w-12 h-12 bg-amber-500 rounded-2xl flex items-center justify-center shadow-lg transform rotate-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M6 18 17.65 6.35M6 6l11.65 11.65M12 12l.01 0"/><circle cx="12" cy="12" r="10"/></svg>
            </div>
        </div>

        <div class="flex gap-3 overflow-x-auto no-scrollbar">
            <div class="flex items-center gap-1.5 shrink-0 bg-slate-50 px-3 py-2 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-600"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span class="text-[10px] font-bold text-slate-600 uppercase tracking-wider">11 AM - 10 PM</span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0 bg-slate-50 px-3 py-2 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-600"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                <span class="text-[10px] font-bold text-slate-600 uppercase tracking-wider">Fine Dining</span>
            </div>
        </div>
    </header>

    <!-- Filters -->
    <div class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 py-4">
        <div class="px-6 mb-4">
            <div class="relative group">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input 
                    id="searchInput"
                    type="text" 
                    placeholder="Search your favorite dish..." 
                    class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all font-medium"
                >
            </div>
        </div>
        <div id="categoryContainer" class="flex gap-2 overflow-x-auto px-6 pb-1 no-scrollbar">
            <!-- Categories Dynamic -->
        </div>
    </div>

    <!-- Menu Section -->
    <main class="px-6 py-6">
        <div class="flex items-center justify-between mb-4">
            <h2 id="activeCategoryTitle" class="text-sm font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                <span class="w-1.5 h-1.5 bg-amber-500 rounded-full"></span>
                ALL ITEMS
            </h2>
        </div>
        <div id="menuGrid" class="grid grid-cols-1 gap-6">
            <!-- Items Dynamic -->
        </div>
        
        <div id="emptyState" class="hidden py-20 text-center">
            <h3 class="text-slate-900 font-bold mb-1">No items found</h3>
            <p class="text-slate-500 text-sm">Try another search term</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 pb-24 px-6 text-center border-t border-slate-100 pt-12">
        <div class="flex flex-col items-center gap-6">
            <div class="w-16 h-16 bg-slate-900 rounded-[2rem] flex items-center justify-center shadow-2xl transform -rotate-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.87A4 4 0 0 1 7.41 6.34 4 4 0 0 1 14 9.5c0 1.35-.44 2.59-1.2 3.6l-5.63 7.42c-.44.58-1.57.58-2.01 0l-1.5-2.01a1 1 0 0 1 0-1.2l2.36-3.15"/></svg>
            </div>
            <div>
                <p class="text-amber-600 text-[10px] uppercase font-black tracking-[0.3em] mb-1">Restaurant Contact</p>
                <h3 class="text-slate-900 font-extrabold text-2xl tracking-tight">SHRENATH</h3>
                <p class="text-slate-400 text-xs mt-1">Available for reservations</p>
            </div>
            <a href="tel:+918072779321" class="bg-slate-900 text-white px-8 py-4 rounded-3xl flex items-center gap-4 shadow-xl hover:bg-slate-800 transition-all active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                <span class="font-bold text-lg">+91 8072779321</span>
            </a>
            <div class="mt-12 text-[9px] text-slate-300 uppercase tracking-widest font-bold">
                Powered by Daddy Amma Digital
            </div>
        </div>
    </footer>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
        <div id="modalOverlay" class="absolute inset-0 bg-slate-900/60 backdrop-blur-md"></div>
        <div id="modalContent" class="relative w-full max-w-lg bg-white rounded-t-[3rem] sm:rounded-[3rem] overflow-y-auto shadow-2xl flex flex-col max-h-[90vh] translate-y-full transition-transform duration-300">
            <button id="closeModal" class="absolute top-6 right-6 z-10 bg-black/30 text-white p-2.5 rounded-full backdrop-blur-md">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
            <div class="h-64 relative flex justify-center items-center">
                <img id="modalImg" src="" alt="" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
            </div>
            <div class="p-8 pb-12">
                <div id="modalBadges" class="flex gap-2 mb-4"></div>
                <h2 id="modalTitle" class="text-3xl font-extrabold text-slate-900 mb-2 tracking-tight"></h2>
                <div id="modalPrice" class="mb-8"></div>
                <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100">
                    <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Item Description</h4>
                    <p id="modalDesc" class="text-slate-600 leading-relaxed font-medium"></p>
                </div>
                <button onclick="closeModalFn()" class="w-full mt-8 bg-slate-900 text-white py-5 rounded-3xl font-extrabold shadow-xl active:scale-95 transition-all">Close Details</button>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script>
        const menuData = [
            { id: 'm1', name: 'Steamed Momos', description: 'Delicate hand-folded dumplings steamed to perfection. Served with our signature spicy red chili dip. Contains fresh garden herbs and choice of protein.', price: { veg: 70, chicken: 80 }, image: './streamed-m.jpg', category: 'Momos', isPopular: true },
            { id: 'm2', name: 'Fried Momos', description: 'Golden-fried dumplings with a light, crispy exterior and a juicy, flavorful filling. A perfect blend of crunch and taste.', price: { veg: 70, chicken: 90 }, image: './fried-m.png', category: 'Momos' },
            { id: 'm4', name: 'Kurkure Momos', description: 'Extremely crunchy momos breaded with a special spiced coating and deep-fried. Tossed with a secret masala blend.', price: { veg: 90, chicken: 100 }, image: './kurkure-m.png', category: 'Momos', isPopular: true },
            { id: 'm6', name: 'Dragon Momos', description: 'Fiery and bold. These momos are tossed in our special "Dragon Sauce" made from roasted red chilies and garlic.', price: 100, image: './dragon-m.png', category: 'Momos', isSpicy: true },
            { id: 'sig1', name: 'Signature Fried Chicken', description: 'The Daddy Amma specialty. Jumbo chicken pieces marinated in house spices, double-breaded for a signature crunch.', price: 150, image: './signature-m.png', category: 'Signature', isPopular: true },
            { id: 'rn2', name: 'Chicken Fried Rice', description: 'Juicy chicken chunks and scrambled eggs fried with long-grain rice and exotic spices.', price: 80, image: './chicken-r.jpg', category: 'Rice & Noodles' },
            { id: 't3', name: 'Triple Chicken Rice', description: 'Our deluxe special: chicken fried rice, noodles, and a rich, spicy chicken manchurian gravy on top.', price: 90, image: './triple-checken.png', category: 'Triple Specials', isPopular: true }
        ];

        const categories = ['All', 'Momos', 'Signature', 'Triple Specials', 'Rice & Noodles'];
        let activeCategory = 'All';
        let searchQuery = '';

        const grid = document.getElementById('menuGrid');
        const catContainer = document.getElementById('categoryContainer');
        const searchInput = document.getElementById('searchInput');

        function formatPrice(p) {
            if (typeof p === 'number') return `<span class="text-amber-600 font-extrabold text-xl">₹${p}</span>`;
            return `<div class="flex gap-4">
                <span class="text-amber-600 font-extrabold">Veg ₹${p.veg}</span>
                <span class="text-amber-600 font-extrabold">Non-Veg ₹${p.chicken}</span>
            </div>`;
        }

        function renderCategories() {
            catContainer.innerHTML = categories.map(c => `
                <button onclick="setCategory('${c}')" class="px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-widest transition-all shrink-0 active:scale-95 ${activeCategory === c ? 'bg-amber-500 text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-100'}">
                    ${c}
                </button>
            `).join('');
        }

        function renderMenu() {
            const filtered = menuData.filter(i => {
                const matchesCat = activeCategory === 'All' || i.category === activeCategory;
                const matchesSearch = i.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            document.getElementById('emptyState').classList.toggle('hidden', filtered.length > 0);
            document.getElementById('activeCategoryTitle').innerHTML = `<span class="w-1.5 h-1.5 bg-amber-500 rounded-full"></span> ${activeCategory.toUpperCase()}`;

            grid.innerHTML = filtered.map(i => `
                <div onclick="openItem('${i.id}')" class="bg-white rounded-[2.5rem] overflow-hidden border border-slate-100 shadow-sm transition-all hover:shadow-xl group">
                    <div class="aspect-[4/3] w-full relative overflow-hidden">
                        <img src="${i.image}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent"></div>
                        ${i.isPopular ? `<div class="absolute top-5 right-5 bg-amber-500 text-white px-3 py-1.5 rounded-full font-black text-[9px] uppercase tracking-wider shadow-lg">Chef's Pick</div>` : ''}
                        <div class="absolute bottom-5 left-6">
                            <p class="text-[9px] text-white font-black uppercase tracking-[0.3em]">${i.category}</p>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-xl font-extrabold text-slate-900 tracking-tight">${i.name}</h3>
                            ${i.isSpicy ? '<div class="text-red-500"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.5 4 6.5 2 2 3 5.5 3 8.5a7 7 0 0 1-14 0c0-3 1.5-5.5 3.5-7 .5 2 1.5 3 3 4.5z"/></svg></div>' : ''}
                        </div>
                        <div class="flex items-center justify-between">
                            ${formatPrice(i.price)}
                            <div class="bg-slate-50 p-2.5 rounded-full text-amber-500 group-hover:bg-amber-500 group-hover:text-white transition-all">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.setCategory = (c) => { activeCategory = c; renderCategories(); renderMenu(); };
        searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; renderMenu(); });

        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modalContent');
        const modalOverlay = document.getElementById('modalOverlay');

        window.openItem = (id) => {
            const item = menuData.find(i => i.id === id);
            document.getElementById('modalImg').src = item.image;
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalPrice').innerHTML = formatPrice(item.price);
            document.getElementById('modalDesc').innerText = item.description;
            document.getElementById('modalBadges').innerHTML = `
                <span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider">${item.category}</span>
                ${item.isSpicy ? '<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider">Extra Spicy</span>' : ''}
            `;
            
            modal.classList.remove('pointer-events-none');
            modal.classList.replace('opacity-0', 'opacity-100');
            modalContent.classList.replace('translate-y-full', 'translate-y-0');
            document.body.classList.add('modal-active');
        };

        window.closeModalFn = () => {
            modal.classList.replace('opacity-100', 'opacity-0');
            modalContent.classList.replace('translate-y-0', 'translate-y-full');
            setTimeout(() => {
                modal.classList.add('pointer-events-none');
                document.body.classList.remove('modal-active');
            }, 300);
        };

        document.getElementById('closeModal').onclick = closeModalFn;
        modalOverlay.onclick = closeModalFn;

        renderCategories();
        renderMenu();
    </script>
</body>
</html>
